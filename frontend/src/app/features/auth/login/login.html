<section class="painel auth">
  <h1>Entrar</h1>

  @if (aviso(); as mensagem) {
    <p class="aviso-sucesso" role="status">{{ mensagem }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
    @if (erro(); as mensagem) {
      <p class="aviso-erro" role="alert">{{ mensagem }}</p>
    }

    <app-form-field label="E-mail" inputId="login-email" [control]="form.controls.email">
      <input id="login-email" type="email" formControlName="email" autocomplete="email" />
    </app-form-field>

    <app-form-field label="Senha" inputId="login-senha" [control]="form.controls.senha">
      <input
        id="login-senha"
        type="password"
        formControlName="senha"
        autocomplete="current-password"
      />
    </app-form-field>

    <app-button type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </app-button>
  </form>

  <p class="auth__alternativa">Ainda não tem conta? <a routerLink="/registro">Criar conta</a></p>
</section>

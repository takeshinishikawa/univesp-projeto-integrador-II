# Cabeçalhos de segurança das páginas servidas pelo Nginx (a API recebe os do helmet).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP: scripts, estilos, imagens e chamadas à API só da própria origem. 'unsafe-inline' em
# style-src porque o Angular e o Chart.js aplicam estilos inline; scripts inline continuam
# bloqueados (por isso o inlineCritical está desligado no angular.json: ele injeta um <script>).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Isolamento entre origens: a aba não compartilha janela com outros sites e nossos arquivos
# não são carregados por outras origens.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;

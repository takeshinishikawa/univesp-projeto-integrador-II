server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Proxy reverso: o navegador chama /api (mesma origem, sem CORS) e o Nginx
  # encaminha para o serviço "backend" da rede do Docker Compose.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Documentação Swagger da API
  location /api-docs {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }

  # Arquivos com hash no nome podem ser cacheados por muito tempo.
  location ~* \.(?:js|css|woff2?|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer rota do Angular cai no index.html (sem cache).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo PR/branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  backend:
    name: Backend (lint, build, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # MySQL efêmero: existe só durante o job, para os testes de integração usarem um banco real.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: financas_test
          MYSQL_USER: app
          MYSQL_PASSWORD: ci-app-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci-root-only@127.0.0.1:3306/financas_test
      DATABASE_URL_TEST: mysql://root:ci-root-only@127.0.0.1:3306/financas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - name: Aplicar migrations no MySQL efêmero
        run: npx prisma migrate deploy
      # O Prisma 6 traz um aviso "high" no deepmerge-ts, usado só ao ler a configuração do
      # próprio Prisma (não recebe dados de usuário); a correção exige o Prisma 7. Por isso o
      # backend bloqueia só em "critical"; o relatório completo aparece no log deste passo.
      - name: Auditoria de dependências (npm audit)
        run: npm audit --omit=dev || npm audit --omit=dev --audit-level=critical
      - name: Testes (unitários + integração) com cobertura
        run: npm test -- --ci --coverage
      - name: Relatório de cobertura do backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/
          retention-days: 14

  frontend:
    name: Frontend (lint, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Auditoria de dependências (npm audit)
        run: npm audit --audit-level=high
      - name: Testes com cobertura
        run: npm test -- --watch=false --coverage
      - name: Relatório de cobertura do frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          retention-days: 14
      - run: npm run build

  # Sobe a aplicação inteira (MySQL + API + Nginx com o Angular) e exercita o fluxo principal.
  smoke:
    name: Aplicação completa (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Criar .env.local com segredos descartáveis
        run: |
          {
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 12)"
            echo "MYSQL_USER=app"
            echo "MYSQL_PASSWORD=$(openssl rand -hex 12)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env.local
      - name: Subir a stack
        run: docker compose --env-file .env.local up --build -d --wait --wait-timeout 300
      - name: Fluxo principal pela API (via Nginx)
        run: bash .github/scripts/smoke.sh http://localhost:4200
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Instalar dependências do Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Testes E2E (Playwright) + acessibilidade (axe-core)
        working-directory: e2e
        run: npx playwright test --workers=2
      - name: Relatório do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      # Na imagem oficial do Playwright, a mesma usada para gerar as imagens de referência.
      - name: Regressão visual (Playwright)
        working-directory: e2e
        run: >-
          docker run --rm --network host -v "$PWD:/e2e" -w /e2e
          mcr.microsoft.com/playwright:v1.63.0-noble npm run test:visual
      - name: Diferenças da regressão visual (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regressao-visual
          path: e2e/test-results/
          retention-days: 7
      - name: Performance e acessibilidade (Lighthouse)
        working-directory: e2e
        run: npm run lighthouse
      - name: Relatório do Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-lighthouse
          path: e2e/lighthouse-report/
          retention-days: 14
      # Varredura passiva do OWASP ZAP (inclui o spider AJAX, para enxergar as telas do Angular).
      # Aponta cabeçalhos, cookies e respostas que expõem informação. Os alertas não derrubam o
      # job (-I); o relatório fica como artefato.
      - name: Segurança (OWASP ZAP baseline)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:4200 -j -m 2 -I -r zap.html -J zap.json -w zap.md
          cat zap/zap.md >> "$GITHUB_STEP_SUMMARY"
      - name: Relatório do OWASP ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguranca-zap
          path: zap/
          retention-days: 14
      - name: Logs em caso de falha
        if: failure()
        run: docker compose --env-file .env.local logs --no-color --tail=200
      - name: Derrubar a stack
        if: always()
        run: docker compose --env-file .env.local down -v
